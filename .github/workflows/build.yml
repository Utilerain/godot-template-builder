name: Build export templates

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Windows x86_64 (incl. console wrappers)"
        type: boolean
        default: true
      build_linux:
        description: "Linux x86_64"
        type: boolean
        default: true
      build_web:
        description: "Web (wasm32: release/debug x threads/nothreads x dlink)"
        type: boolean
        default: false
      build_android:
        description: "Android (arm32/arm64/x86_64 APKs + source)"
        type: boolean
        default: false
      build_ios:
        description: "iOS (arm64 device + x86_64 simulator) — macOS runner, 10x minutes"
        type: boolean
        default: false
      build_macos:
        description: "macOS (universal x86_64+arm64) — macOS runner, 10x minutes"
        type: boolean
        default: false
      build_dotnet:
        description: ".NET/mono templates (separate *_mono TPZ; doubles build time; no Web)"
        type: boolean
        default: false
      extra_scons_args:
        description: "Extra SCons args appended to each scons build (e.g. vulkan=no)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-export-templates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate & plan
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      dotnet: ${{ steps.flags.outputs.dotnet }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate pinned Godot version (stable only)
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_version.py --file GODOT_VERSION

      - name: Check build profile
        run: python scripts/prepare_profile.py --input profiles/build_profile.json --output .build/profile.gdbuild

      - name: Compute build matrix
        id: matrix
        env:
          BUILD_WINDOWS: ${{ inputs.build_windows }}
          BUILD_LINUX: ${{ inputs.build_linux }}
          BUILD_WEB: ${{ inputs.build_web }}
          BUILD_ANDROID: ${{ inputs.build_android }}
          BUILD_IOS: ${{ inputs.build_ios }}
          BUILD_MACOS: ${{ inputs.build_macos }}
          BUILD_DOTNET: ${{ inputs.build_dotnet }}
        run: >
          python scripts/make_matrix.py
          --windows "$BUILD_WINDOWS" --linux "$BUILD_LINUX" --web "$BUILD_WEB"
          --android "$BUILD_ANDROID" --ios "$BUILD_IOS" --macos "$BUILD_MACOS"
          --dotnet "$BUILD_DOTNET"

      - name: Record build flags
        id: flags
        run: echo "dotnet=${{ inputs.build_dotnet }}" >> "$GITHUB_OUTPUT"

  net-glue:
    name: net / mono glue (linux editor)
    needs: validate
    if: inputs.build_dotnet == true
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
      SCONS_CACHE_LIMIT: 4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Cache SCons build cache
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-net-glue-${{ needs.validate.outputs.tag }}-${{ hashFiles('profiles/*.json') }}
          restore-keys: |
            scons-net-glue-${{ needs.validate.outputs.tag }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev libxkbcommon-dev

      - name: Checkout Godot ${{ needs.validate.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ needs.validate.outputs.tag }}
          path: godot

      - name: Prepare build profile
        run: python scripts/prepare_profile.py --input profiles/build_profile.json --output .build/profile.gdbuild

      - name: Build mono editor (glue generator)
        working-directory: godot
        run: >
          scons platform=linuxbsd target=editor arch=x86_64 module_mono_enabled=yes
          debug_symbols=no use_static_cpp=no progress=no
          build_profile=../.build/profile.gdbuild
          ${{ inputs.extra_scons_args }}

      - name: Generate mono glue
        working-directory: godot
        run: |
          mkdir -p ../glue_out
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue ../glue_out
          # "|| true": find gets SIGPIPE from head, which fails the step under pipefail.
          find ../glue_out -type f | head -10 || true
          # Sentinels for both generated API assemblies (modules/mono/editor/bindings_generator.h:
          # BINDINGS_CLASS_NATIVECALLS / BINDINGS_CLASS_NATIVECALLS_EDITOR).
          test -f ../glue_out/GodotSharp/GodotSharp/Generated/NativeCalls.cs
          test -f ../glue_out/GodotSharp/GodotSharpEditor/Generated/EditorNativeCalls.cs

      - name: Upload glue artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-net-glue
          path: glue_out/**
          if-no-files-found: error

  build:
    name: ${{ matrix.key }}
    needs: [validate, net-glue]
    if: always() && needs.validate.result == 'success' && (needs.net-glue.result == 'success' || needs.net-glue.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.matrix) }}
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
      SCONS_CACHE_LIMIT: 4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET SDK (mono builds)
        if: matrix.variant == 'mono'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Cache SCons build cache
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.key }}-${{ needs.validate.outputs.tag }}-${{ hashFiles('profiles/*.json') }}
          restore-keys: |
            scons-${{ matrix.key }}-${{ needs.validate.outputs.tag }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev libxkbcommon-dev

      - name: Set up Java 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Emscripten (Web)
        if: matrix.platform == 'web'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.11
          no-cache: true

      - name: Checkout Godot ${{ needs.validate.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ needs.validate.outputs.tag }}
          path: godot

      - name: Prepare build profile
        run: python scripts/prepare_profile.py --input profiles/build_profile.json --output .build/profile.gdbuild

      - name: Restore mono glue
        if: matrix.variant == 'mono'
        uses: actions/download-artifact@v4
        with:
          name: template-net-glue
          path: glue_artifacts

      - name: Copy mono glue into sources
        if: matrix.variant == 'mono'
        shell: bash
        run: |
          # The official mono flow copies both generated API assemblies before
          # building the mono templates.
          cp -r glue_artifacts/GodotSharp/GodotSharp/Generated godot/modules/mono/glue/GodotSharp/GodotSharp/
          cp -r glue_artifacts/GodotSharp/GodotSharpEditor/Generated godot/modules/mono/glue/GodotSharp/GodotSharpEditor/
          find godot/modules/mono/glue/GodotSharp -name "*.cs" -type f | head -5 || true

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        working-directory: godot
        run: |
          # Official templates ship with AccessKit support; the SDK degrades
          # gracefully to accesskit=no on Linux if the download fails.
          python misc/scripts/install_accesskit.py || echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
          scons platform=linux target=${{ matrix.target }} arch=x86_64 production=yes \
            ${{ matrix.mono_flag }} progress=no \
            build_profile=../.build/profile.gdbuild \
            ${{ matrix.scons_extra }} ${{ inputs.extra_scons_args }}

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        working-directory: godot
        shell: bash
        run: |
          # d3d12/angle/accesskit are on by default for Windows and hard-fail the
          # build when their SDKs are missing; install them like the official CI
          # does, degrading to the =no flag on failure.
          D3D12=yes
          ANGLE=yes
          AK=yes
          python misc/scripts/install_d3d12_sdk_windows.py || D3D12=no
          python misc/scripts/install_angle.py || ANGLE=no
          python misc/scripts/install_accesskit.py || AK=no
          scons platform=windows target=${{ matrix.target }} arch=x86_64 production=yes \
            ${{ matrix.mono_flag }} progress=no \
            build_profile=../.build/profile.gdbuild \
            d3d12=$D3D12 angle=$ANGLE accesskit=$AK \
            ${{ matrix.scons_extra }} ${{ inputs.extra_scons_args }}

      - name: Build (Web, all eight variants)
        if: matrix.platform == 'web'
        env:
          SCONS_JOBS: "2"
          SCONS_EXTRA_ARGS: module_mono_enabled=no build_profile=${{ github.workspace }}/.build/profile.gdbuild ${{ inputs.extra_scons_args }}
        run: bash scripts/build_web.sh godot

      - name: Build (Android, ${{ matrix.arch }})
        if: matrix.platform == 'android'
        working-directory: godot
        run: |
          SW=yes
          python misc/scripts/install_swappy_android.py || SW=no
          scons platform=android target=template_release arch=${{ matrix.arch }} production=yes swappy=$SW ${{ matrix.mono_flag }} progress=no build_profile=../.build/profile.gdbuild ${{ inputs.extra_scons_args }}
          scons platform=android target=template_debug arch=${{ matrix.arch }} production=yes swappy=$SW ${{ matrix.mono_flag }} progress=no build_profile=../.build/profile.gdbuild ${{ inputs.extra_scons_args }}

      - name: Stage Android libraries
        if: matrix.platform == 'android'
        run: |
          mkdir -p android_libs
          cp -r godot/platform/android/java/lib/libs/release android_libs/ 2>/dev/null || true
          cp -r godot/platform/android/java/lib/libs/debug android_libs/ 2>/dev/null || true
          find android_libs -type f | sort

      - name: Build (iOS, device + simulator)
        if: matrix.platform == 'ios'
        working-directory: godot
        run: |
          AK=yes
          python misc/scripts/install_accesskit.py || AK=no
          scons platform=ios target=template_release arch=arm64 production=yes use_lto=no accesskit=$AK ${{ matrix.mono_flag }} progress=no build_profile=../.build/profile.gdbuild ${{ inputs.extra_scons_args }}
          scons platform=ios target=template_debug arch=arm64 production=yes use_lto=no accesskit=$AK ${{ matrix.mono_flag }} progress=no build_profile=../.build/profile.gdbuild ${{ inputs.extra_scons_args }}
          scons platform=ios target=template_release arch=x86_64 simulator=yes production=yes use_lto=no accesskit=$AK ${{ matrix.mono_flag }} progress=no build_profile=../.build/profile.gdbuild ${{ inputs.extra_scons_args }}
          scons platform=ios target=template_debug arch=x86_64 simulator=yes production=yes use_lto=no accesskit=$AK ${{ matrix.mono_flag }} progress=no build_profile=../.build/profile.gdbuild ${{ inputs.extra_scons_args }}

      - name: Package (iOS)
        if: matrix.platform == 'ios'
        env:
          # package_ios.sh defaults to <godot>/ios_out; upload glob is relative to the workspace root.
          IOS_OUT_DIR: ${{ github.workspace }}/ios_out
        run: |
          mkdir -p "$IOS_OUT_DIR"
          bash scripts/package_ios.sh godot

      - name: Build (macOS, ${{ matrix.target }})
        if: matrix.platform == 'macos'
        working-directory: godot
        run: |
          ANG=yes
          AK=yes
          VK=yes
          python misc/scripts/install_angle.py || ANG=no
          python misc/scripts/install_accesskit.py || AK=no
          sh misc/scripts/install_vulkan_sdk_macos.sh || VK=no
          scons platform=macos target=${{ matrix.target }} arch=x86_64 production=yes vulkan=$VK angle=$ANG accesskit=$AK ${{ matrix.mono_flag }} progress=no build_profile=../.build/profile.gdbuild ${{ matrix.scons_extra }} ${{ inputs.extra_scons_args }}
          scons platform=macos target=${{ matrix.target }} arch=arm64 production=yes vulkan=$VK angle=$ANG accesskit=$AK ${{ matrix.mono_flag }} progress=no build_profile=../.build/profile.gdbuild ${{ matrix.scons_extra }} ${{ inputs.extra_scons_args }}

      - name: Stage macOS binaries (lipo -> universal)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p macos_out
          lipo -create \
            godot/bin/godot.macos.${{ matrix.target }}.x86_64${{ matrix.bin_suffix }} \
            godot/bin/godot.macos.${{ matrix.target }}.arm64${{ matrix.bin_suffix }} \
            -output macos_out/godot_macos_${{ matrix.short_target }}.universal
          chmod +x macos_out/*
          file macos_out/* || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-${{ matrix.key }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  android-gradle:
    name: android / gradle packaging
    needs: [validate, build]
    if: always() && needs.validate.result == 'success' && needs.build.result == 'success' && contains(needs.validate.outputs.matrix, '"android-')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.1.0"

      - name: Checkout Godot ${{ needs.validate.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ needs.validate.outputs.tag }}
          path: godot

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: template-android-*
          path: android_artifacts
          merge-multiple: false

      - name: Restore native libraries layout
        run: |
          mkdir -p godot/platform/android/java/lib/libs
          for dir in android_artifacts/*/; do
            cp -r "$dir"release godot/platform/android/java/lib/libs/ 2>/dev/null || true
            cp -r "$dir"debug godot/platform/android/java/lib/libs/ 2>/dev/null || true
          done
          find godot/platform/android/java/lib/libs -type f | sort

      # Gradle's configure phase resolves "scons" from PATH even though the
      # scons build tasks are excluded (the prebuilt libraries are packaged
      # instead) — without it the build fails before any task runs.
      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Generate Android templates
        working-directory: godot/platform/android/java
        run: ./gradlew generateGodotTemplates

      - name: Collect generated templates
        run: |
          mkdir -p android_out
          find godot \( -name "android_release.apk" -o -name "android_debug.apk" -o -name "android_source.zip" \) -exec cp {} android_out/ \;
          ls -l android_out/
          test -f android_out/android_release.apk
          test -f android_out/android_debug.apk
          test -f android_out/android_source.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-android
          path: android_out/*
          if-no-files-found: error

  net-android-gradle:
    name: net / android gradle packaging
    needs: [validate, build]
    if: always() && needs.validate.result == 'success' && needs.build.result == 'success' && contains(needs.validate.outputs.matrix, '"net-android-')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.1.0"

      - name: Checkout Godot ${{ needs.validate.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ needs.validate.outputs.tag }}
          path: godot

      - name: Download mono native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: template-net-android-*
          path: android_artifacts
          merge-multiple: false

      - name: Restore native libraries layout
        run: |
          mkdir -p godot/platform/android/java/lib/libs
          for dir in android_artifacts/*/; do
            cp -r "$dir"release godot/platform/android/java/lib/libs/ 2>/dev/null || true
            cp -r "$dir"debug godot/platform/android/java/lib/libs/ 2>/dev/null || true
          done
          find godot/platform/android/java/lib/libs -type f | sort

      # Same scons PATH requirement as the standard gradle packaging job.
      - name: Install SCons
        run: python -m pip install --upgrade scons

      - name: Generate mono Android templates
        working-directory: godot/platform/android/java
        run: ./gradlew generateGodotMonoTemplates

      - name: Collect generated mono templates
        run: |
          mkdir -p android_out
          find godot \( -name "android_monoRelease.apk" -o -name "android_monoDebug.apk" -o -name "android_source.zip" \) -exec cp {} android_out/ \;
          mv -f android_out/android_monoRelease.apk android_out/android_release.apk
          mv -f android_out/android_monoDebug.apk android_out/android_debug.apk
          ls -l android_out/
          test -f android_out/android_release.apk
          test -f android_out/android_debug.apk
          test -f android_out/android_source.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-net-android
          path: android_out/*
          if-no-files-found: error

  package-release:
    name: Package & publish release
    needs: [validate, build, android-gradle, net-android-gradle]
    if: >-
      always() && needs.validate.result == 'success' && needs.build.result == 'success'
      && (needs.android-gradle.result == 'success' || needs.android-gradle.result == 'skipped')
      && (needs.net-android-gradle.result == 'success' || needs.net-android-gradle.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout Godot sources (version metadata + app bundle template)
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ needs.validate.outputs.tag }}
          path: godot

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: template-*
          path: artifacts
          merge-multiple: false

      - name: Compute template version from sources
        id: tpl
        run: python scripts/make_version_txt.py --godot-dir godot >> "$GITHUB_OUTPUT"

      - name: Prepare profile summary
        run: python scripts/prepare_profile.py --input profiles/build_profile.json --output .build/profile.gdbuild

      - name: Assemble template package
        run: python scripts/package_templates.py --variant standard --tpl-dir "${{ steps.tpl.outputs.template_dir }}" --tag "$TAG" --artifacts artifacts --dist-dir godot/misc/dist --icudt godot/thirdparty/icu4c/icudt_godot.dat --output .

      - name: Assemble mono template package
        if: needs.validate.outputs.dotnet == 'true'
        run: python scripts/package_templates.py --variant mono --tpl-dir "${{ steps.tpl.outputs.template_dir }}" --tag "$TAG" --artifacts artifacts --dist-dir godot/misc/dist --icudt godot/thirdparty/icu4c/icudt_godot.dat --output .

      - name: Generate release notes
        run: |
          ARGS="--tag $TAG --tpl-dir ${{ steps.tpl.outputs.template_dir }} --profile .build/profile.gdbuild --repo-sha ${{ github.sha }} --output RELEASE_NOTES.md"
          if [ "${{ needs.validate.outputs.dotnet }}" == "true" ]; then
            python scripts/make_release_notes.py $ARGS --tpz "Godot_v${TAG}_export_templates.tpz" --tpz "Godot_v${TAG}_mono_export_templates.tpz"
          else
            python scripts/make_release_notes.py $ARGS --tpz "Godot_v${TAG}_export_templates.tpz"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp Godot_v*_export_templates.tpz dist/
          {
            echo ""
            echo "---"
            echo "Built on $(date -u '+%Y-%m-%d %H:%M UTC') from commit \`${GITHUB_SHA::12}\` by [run #$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } >> RELEASE_NOTES.md
          TITLE="Godot $TAG — custom export templates"
          if gh release view "godot-$TAG" > /dev/null 2>&1; then
            # Re-run for the same version: replace all assets and refresh the
            # notes, so stale assets from an earlier run can not survive.
            gh release view "godot-$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "godot-$TAG" "$asset" --yes
            done
            gh release upload "godot-$TAG" --clobber dist/*
            gh release edit "godot-$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --latest
            echo "Updated existing release godot-$TAG"
          else
            gh release create "godot-$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --latest dist/*
            echo "Created release godot-$TAG"
          fi
